<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animal — FarmTracker</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <header>
      <h1>FarmTracker</h1>
      <nav>
        <a href="index.html">Paddocks</a>
        <a href="animals.html" class="active">Animals</a>
      </nav>
    </header>

    <main>
      <a href="animals.html" class="back-link">← Back to Animals</a>
      <div id="animal-detail"><p class="loading">Loading…</p></div>

      <section id="health-section" style="display: none">
        <h3>Health Events</h3>

        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th>Vet</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="events-body"></tbody>
        </table>

        <h4>Log Health Event</h4>

        <form id="event-form">
          <label>
            Type
            <select name="event_type" required>
              <option value="vaccination">Vaccination</option>
              <option value="checkup">Checkup</option>
              <option value="treatment">Treatment</option>
              <option value="injury">Injury</option>
            </select>
          </label>

          <label>
            Date
            <input type="date" name="date" required />
          </label>

          <label>
            Vet
            <input type="text" name="vet_name" placeholder="Optional" />
          </label>

          <label>
            Notes
            <input type="text" name="notes" placeholder="Optional" />
          </label>

          <button type="submit">Log Event</button>
        </form>
      </section>

      <section id="weight-section" style="display: none">
        <div class="section-header">
          <h3>Weight History</h3>
          <p id="latest-weight" class="latest-weight"></p>
        </div>

        <div
          id="weight-chart-card"
          class="weight-chart-card"
          style="display: none"
        >
          <canvas id="weight-chart"></canvas>
        </div>
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Weight (kg)</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="weights-body"></tbody>
        </table>

        <h4>Log New Weight</h4>

        <form id="weight-form">
          <div class="form-row">
            <label>
              Weight (kg) *
              <input
                type="number"
                name="weight_kg"
                min="0.1"
                step="0.1"
                required
              />
            </label>

            <label>
              Date *
              <input type="date" name="date" required />
            </label>
          </div>

          <label>
            Notes
            <input type="text" name="notes" placeholder="Optional" />
          </label>

          <button type="submit">Log Weight</button>
        </form>
      </section>
    </main>

    <script src="app.js"></script>

    <script>
      const params = new URLSearchParams(window.location.search);
      const animalId = params.get("id");

      let weightChart = null;

      async function load() {
        const animal = await api.get(`/animals/${animalId}`);

        document.title = `${animal.name} — FarmTracker`;

        document.getElementById("animal-detail").innerHTML = `
          <div class="animal-header">
            <h2>${animal.name}<span class="tag">${animal.tag_number}</span></h2>
          </div>
          <dl>
            <dt>Breed</dt>       <dd>${animal.breed ?? "—"}</dd>
            <dt>Date of Birth</dt><dd>${animal.date_of_birth ?? "—"}</dd>
            <dt>Paddock</dt>     <dd>${animal.paddock_id ?? "Unassigned"}</dd>
          </dl>
        `;

        const today = new Date().toISOString().slice(0, 10);

        document.querySelector('#event-form input[name="date"]').value = today;
        document.querySelector('#weight-form input[name="date"]').value = today;

        document.getElementById("health-section").style.display = "block";
        document.getElementById("weight-section").style.display = "block";

        await loadEvents();
        await loadWeights();
      }

      async function loadEvents() {
        const events = await api.get(`/animals/${animalId}/health-events`);
        const tbody = document.getElementById("events-body");

        tbody.innerHTML = events.length
          ? events
              .map(
                (event) => `
                  <tr>
                    <td>${event.date}</td>
                    <td>${event.event_type}</td>
                    <td>${event.vet_name ?? "—"}</td>
                    <td>${event.notes ?? "—"}</td>
                  </tr>
                `,
              )
              .join("")
          : '<tr><td colspan="4" class="empty">No events recorded.</td></tr>';
      }

      async function loadWeights() {
        const weights = await api.get(`/animals/${animalId}/weights`);

        const tbody = document.getElementById("weights-body");
        const latestWeight = document.getElementById("latest-weight");

        renderWeightChart(weights);

        if (!weights.length) {
          latestWeight.textContent = "No weight records yet.";

          tbody.innerHTML = `
            <tr>
              <td colspan="3" class="empty">No weights recorded yet.</td>
            </tr>
          `;

          return;
        }

        const latest = weights[0];

        latestWeight.innerHTML = `
          <strong>Latest:</strong> ${latest.weight_kg} kg on ${latest.date}
        `;

        tbody.innerHTML = weights
          .map(
            (weight) => `
              <tr>
                <td>${weight.date}</td>
                <td>${weight.weight_kg}</td>
                <td>${weight.notes || "—"}</td>
              </tr>
            `,
          )
          .join("");
      }

      function renderWeightChart(weights) {
        const chartCard = document.getElementById("weight-chart-card");
        const canvas = document.getElementById("weight-chart");

        if (!chartCard || !canvas) return;

        if (weightChart) {
          weightChart.destroy();
          weightChart = null;
        }

        if (!weights.length) {
          chartCard.style.display = "none";
          return;
        }

        chartCard.style.display = "block";

        // Backend returns newest -> oldest.
        // Chart should display oldest -> newest.
        const chartWeights = [...weights].reverse();

        const labels = chartWeights.map((weight) => weight.date);
        const data = chartWeights.map((weight) => Number(weight.weight_kg));

        weightChart = new Chart(canvas, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Weight (kg)",
                data,
                borderColor: "#0b7d3b",
                backgroundColor: "#0b7d3b",
                borderWidth: 2,
                pointRadius: 4,
                pointHoverRadius: 5,
                tension: 0.3,
                fill: false,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: false,
              },
            },
            scales: {
              y: {
                title: {
                  display: true,
                  text: "Weight (kg)",
                },
                beginAtZero: false,
                grid: {
                  color: "#e5e5e0",
                  borderDash: [4, 4],
                },
              },
              x: {
                grid: {
                  color: "#e5e5e0",
                  borderDash: [4, 4],
                },
              },
            },
          },
        });
      }
      document
        .getElementById("event-form")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          const data = Object.fromEntries(new FormData(event.target));

          await api.post(`/animals/${animalId}/health-events`, data);

          event.target.reset();

          const today = new Date().toISOString().slice(0, 10);
          event.target.date.value = today;

          await loadEvents();
        });

      document
        .getElementById("weight-form")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          const data = Object.fromEntries(new FormData(event.target));
          data.weight_kg = Number(data.weight_kg);

          await api.post(`/animals/${animalId}/weights`, data);

          event.target.reset();

          const today = new Date().toISOString().slice(0, 10);
          event.target.date.value = today;

          await loadWeights();
        });

      load();
    </script>
  </body>
</html>
